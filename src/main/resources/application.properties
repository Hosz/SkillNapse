spring.application.name=skillnapse
spring.config.import=optional:file:.env[.properties]

# Configurações de Conexão com o PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:skillnapse}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Configurações do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Configurações do Flyway Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Configurações de IA (BYOK - Bring Your Own Key)
skillnapse.ai.provider=${AI_PROVIDER:gemini}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:${SPRING_AI_GOOGLE_GENAI_API_KEY:}}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:${SPRING_AI_GOOGLE_GENAI_CHAT_MODEL:gemini-3.5-flash-lite}}
spring.ai.openai.api-key=${OPENAI_API_KEY:${SPRING_AI_OPENAI_API_KEY:mock-openai-key}}
spring.ai.openai.chat.model=${OPENAI_MODEL:${SPRING_AI_OPENAI_CHAT_MODEL:gpt-4o-mini}}
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:${SPRING_AI_OLLAMA_CHAT_MODEL:llama3.2}}

# Fallback Multi-Provedor de IA (Groq / OpenAI / Ollama / Gemini Secundário)
skillnapse.ai.fallback.enabled=${AI_FALLBACK_ENABLED:false}
skillnapse.ai.fallback.provider=${AI_FALLBACK_PROVIDER:groq}
skillnapse.ai.fallback.base-url=${AI_FALLBACK_BASE_URL:https://api.groq.com/openai/v1}
skillnapse.ai.fallback.api-key=${AI_FALLBACK_API_KEY:}
skillnapse.ai.fallback.model=${AI_FALLBACK_MODEL:openai/gpt-oss-120b}
skillnapse.ai.fallback.gemini-api-key=${GEMINI_FALLBACK_API_KEY:}
skillnapse.ai.fallback.gemini-model=${GEMINI_FALLBACK_MODEL:gemini-3.8-flash}

# Configuração do JWT
skillnapse.jwt.secret=${JWT_SECRET}
skillnapse.jwt.expiration=3600000
skillnapse.jwt.refresh-expiration=604800000